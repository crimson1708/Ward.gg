name: Game metadata backfill

# Per-game durations for CS/min and gold/min, plus winners for any game the
# main ingest couldn't resolve inline. The duration lookup is a ~10-request
# binary search per game (see lib/lolEsports.ts findGameStartMs), far too slow
# for the refresh cadence, so it runs here on its own bounded schedule.
on:
  schedule:
    - cron: "30 */3 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of games to process this run"
        required: false
        default: "150"

concurrency:
  group: gamemeta
  cancel-in-progress: false

jobs:
  gamemeta:
    runs-on: ubuntu-latest
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm dies mid-install often enough to matter at this cadence — usually
      # "Exit handler never called!" or a registry timeout. That's an npm/network
      # fault rather than a broken build, but it still fails the run and mails a
      # failure notice, so retry before believing it. `cache: npm` above keeps
      # most of the install off the network in the first place.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed (attempt $attempt) - retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          exit 1

      - run: npx tsx scripts/ingest-gamemeta.mts ${{ github.event.inputs.limit || '150' }}
