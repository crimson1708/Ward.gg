name: Refresh data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm dies mid-install often enough to matter at this cadence — usually
      # "Exit handler never called!" or a registry timeout. That's an npm/network
      # fault rather than a broken build, but it still fails the run and mails a
      # failure notice, so retry before believing it. `cache: npm` above keeps
      # most of the install off the network in the first place.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed (attempt $attempt) - retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          exit 1

      - run: npm run refresh
